<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>cena · Ribeira das Naus</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14100c; overflow: hidden; }
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #e8e0d2;
      }
      #palco { position: fixed; inset: 0; }
      #painel {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(20, 16, 12, 0.88); border: 1px solid #3a3128;
        padding: 10px 12px; border-radius: 6px; min-width: 190px;
        backdrop-filter: blur(4px);
      }
      #painel h1 {
        margin: 0 0 8px; font-size: 11px; letter-spacing: .12em;
        text-transform: uppercase; color: #b9a480; font-weight: 600;
      }
      #painel label {
        display: flex; align-items: center; gap: 7px;
        padding: 2px 0; cursor: pointer; user-select: none;
      }
      #painel input { accent-color: #c8961e; margin: 0; }
      #estado {
        margin-top: 9px; padding-top: 8px; border-top: 1px solid #3a3128;
        font-size: 11px; color: #8d8172; white-space: pre-line;
      }
      #erro {
        position: fixed; inset: 40px; z-index: 20; display: none;
        background: #2a1414; border: 1px solid #7a2b2b; padding: 20px;
        border-radius: 6px; overflow: auto; white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="palco"></div>
    <div id="painel">
      <h1>cena</h1>
      <label><input type="checkbox" id="t-grelha" /> grelha de tiles</label>
      <label><input type="checkbox" id="t-colisao" /> colisão</label>
      <label><input type="checkbox" id="t-spawns" /> lugares e zonas</label>
      <label><input type="checkbox" id="t-oficiais" checked /> oficiais</label>
      <div id="estado">a carregar…</div>
    </div>
    <div id="erro"></div>
    <script type="module" src="./src/cena.tsx"></script>
  </body>
</html>
